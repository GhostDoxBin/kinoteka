<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>КиноHUB - сериалы и мультфильмы</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
</head>
<body>

<header>
    <div class="logo">
        <span class="logo-icon">🎬</span>
        <span class="logo-text">КиноHUB</span>
    </div>
    <div class="user-panel" id="userPanel">
        <button class="auth-btn" id="showLoginBtn">Вход</button>
        <button class="auth-btn" id="showRegisterBtn">Регистрация</button>
    </div>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Поиск сериала или мультфильма...">
    </div>
</header>

<nav class="genre-filters">
    <button class="filter-btn active" data-genre="all">Все</button>
    <button class="filter-btn" data-genre="сериал">Сериалы</button>
    <button class="filter-btn" data-genre="мультфильм">Мультфильмы</button>
    <button class="filter-btn" data-genre="боевик">Боевики</button>
    <button class="filter-btn" data-genre="комедия">Комедии</button>
    <button class="filter-btn" data-genre="драма">Драмы</button>
    <button class="filter-btn" data-genre="фантастика">Фантастика</button>
    <button class="filter-btn" data-genre="приключения">Приключения</button>
    <button class="filter-btn" data-genre="криминал">Криминал</button>
</nav>

<main class="catalog" id="catalogContainer">
    <div class="loading">Загрузка контента...</div>
</main>

<!-- Модальное окно входа -->
<div id="loginModal" class="modal auth-modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Вход в аккаунт</h2>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        <p>Нет аккаунта? <a id="switchToRegister">Зарегистрироваться</a></p>
    </div>
</div>

<!-- Модальное окно регистрации -->
<div id="registerModal" class="modal auth-modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Регистрация</h2>
        <form id="registerForm">
            <input type="text" id="regUsername" placeholder="Имя пользователя" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPassword" placeholder="Пароль" required>
            <button type="submit">Зарегистрироваться</button>
        </form>
        <p>Уже есть аккаунт? <a id="switchToLogin">Войти</a></p>
    </div>
</div>

<!-- Модальное окно профиля -->
<div id="profileModal" class="modal auth-modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Профиль пользователя</h2>
        <div class="profile-info">
            <p><strong>Имя:</strong> <span id="profileUsername"></span></p>
            <p><strong>Email:</strong> <span id="profileEmail"></span></p>
            <p><strong>Дата регистрации:</strong> <span id="profileDate"></span></p>
            <p><strong>Избранное:</strong> <span id="profileFavoritesCount">0</span> фильмов</p>
        </div>
        <button id="logoutBtn" class="logout-btn">Выйти из аккаунта</button>
    </div>
</div>

<!-- Модальное окно плеера -->
<div id="playerModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <div class="player-container">
            <h2 id="modalTitle"></h2>
            <div class="video-wrapper">
                <video id="videoPlayer" controls preload="auto">
                    <source id="videoSource" src="" type="video/mp4">
                    Ваш браузер не поддерживает видео.
                </video>
            </div>
            <div class="video-info">
                <p class="year-rating" id="modalYearRating"></p>
                <p class="description" id="modalDescription"></p>
            </div>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 КиноHUB. Учебный проект. Все права защищены.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
